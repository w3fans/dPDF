name: Windows lane and report

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      lane:
        type: string
        required: true
      runner_labels:
        type: string
        required: true
      cache_native:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  announce:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish queued receipt before waiting for Windows
        env:
          VALIDATED_COMMIT: ${{ inputs.commit }}
          VALIDATION_LANE: ${{ inputs.lane }}
          VALIDATION_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p queued-report
          python3 scripts/ci/snapshot_actions.py queued-report/actions-jobs.json
          python3 scripts/ci/queued_report.py queued-report
          python3 scripts/ci/publish_report.py --artifact queued-report --pending \
            --commit "$VALIDATED_COMMIT" --lane "$VALIDATION_LANE" \
            --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  validate:
    if: ${{ !github.event.repository.private }}
    needs: announce
    permissions:
      contents: read
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 90
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: harness
          persist-credentials: false
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          path: source
          persist-credentials: false
      - name: Restore hosted native build cache
        if: inputs.cache_native
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/dpdf-msvc-target
          key: dpdf-msvc-v1-${{ hashFiles('source/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            dpdf-msvc-v1-${{ hashFiles('source/Cargo.lock') }}-
            dpdf-msvc-v1-
      - name: Native bounded Windows checks
        shell: powershell
        env:
          VALIDATION_REPORT_DIR: ${{ runner.temp }}/dpdf-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.lane }}
          VALIDATED_COMMIT: ${{ inputs.commit }}
          VALIDATED_REF: ${{ inputs.source_ref }}
          VALIDATION_LANE: ${{ inputs.lane }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:VALIDATION_REPORT_DIR -Force | Out-Null
          $bootstrapLog = Join-Path $env:VALIDATION_REPORT_DIR 'bootstrap.log'
          try {
            $python = if ($env:DPDF_CI_PYTHON) { $env:DPDF_CI_PYTHON } else { (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source }
            $ErrorActionPreference = 'Continue' # Preserve complete native stderr under Windows PowerShell 5.
            & $python harness/scripts/ci/validate_windows.py --source source --commit $env:VALIDATED_COMMIT --ref $env:VALIDATED_REF --lane $env:VALIDATION_LANE --output $env:VALIDATION_REPORT_DIR 2>&1 | ForEach-Object { $_ | Out-File -FilePath $bootstrapLog -Append -Encoding utf8; $_ }
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($code -ne 0) { throw "Windows validation failed ($code)" }
          } catch {
            $_ | Out-String | Out-File -FilePath $bootstrapLog -Append -Encoding utf8
            throw
          }
      - name: Retain hosted native build cache
        if: ${{ always() && inputs.cache_native }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/dpdf-msvc-target
          key: dpdf-msvc-v1-${{ hashFiles('source/Cargo.lock') }}-${{ github.sha }}
      - name: Upload report and per-suite logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dpdf-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.lane }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [announce, validate]
    if: ${{ always() && needs.validate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true # Publish a failed-job receipt even if setup prevented any artifact.
        with:
          name: windows-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-report
      - name: Attach summary and publish diagnostics branch
        env:
          VALIDATED_COMMIT: ${{ inputs.commit }}
          VALIDATION_LANE: ${{ inputs.lane }}
          VALIDATION_REF: ${{ inputs.source_ref }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation-report
          python3 scripts/ci/snapshot_actions.py validation-report/actions-jobs.json
          python3 scripts/ci/failed_job_report.py validation-report
          cat validation-report/README.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/publish_report.py --artifact validation-report \
            --commit "$VALIDATED_COMMIT" --lane "$VALIDATION_LANE" \
            --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
